[package]
name = "fleet-sim"
version = "0.1.0"
edition = "2024"
publish = false
description = "Simulator for fleet-core: a virtual radio and end-to-end scenarios. Never shipped to devices."

[dependencies]
fleet-core = { path = "../fleet-core" }

# Signature checks dominate the scenarios; optimise dependencies (fleet-core,
# ed25519) even in test builds so the suite runs in seconds.
[profile.dev.package."*"]
opt-level = 3
